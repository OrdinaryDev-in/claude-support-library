name: Feature request
description: Suggest an idea or improvement.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: What's missing, or what's currently awkward/impossible?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like to happen?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any other approaches you thought about, and why you didn't pick them.

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Auth
        - Library (prompts)
        - Admin / review workflow
        - Future phases (Skills / Cloud Connectors libraries)
        - Tooling / CI
        - Other
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: Anything else?

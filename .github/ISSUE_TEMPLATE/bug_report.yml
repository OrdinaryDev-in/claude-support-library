name: Bug report
description: Something isn't working as expected.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. If this is a **security
        vulnerability** (auth, RLS, data exposure, privilege escalation),
        please don't file it here — see [SECURITY.md](../../SECURITY.md)
        and email instead.

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of the app is affected?
      options:
        - Auth (login/signup/OAuth/session)
        - Library (browse/filter/search)
        - Prompts (create/edit/delete/detail)
        - Account / profile
        - Admin / review workflow
        - Supabase / RLS / migrations
        - CI / build / tooling
        - Other
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs / console output / screenshots
      description: Paste any error output. This will be rendered as a code block, so no need for backticks.
      render: shell

  - type: input
    id: node-version
    attributes:
      label: Node version
      placeholder: "node -v"

  - type: input
    id: browser
    attributes:
      label: Browser (if applicable)
      placeholder: "e.g. Chrome 128"

  - type: textarea
    id: additional
    attributes:
      label: Anything else?

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-typecheck-build:
    name: Lint, type-check, build
    runs-on: ubuntu-latest
    # Placeholder values only — the build never contacts Supabase (all
    # data-fetching routes are dynamic due to cookies()/auth checks and
    # are skipped during static generation), so these just need to be
    # present strings. Scoped to this job (and `test` below) specifically
    # — NOT a workflow-level `env:` block. A workflow-level block applies
    # to every job, test-e2e included, and since GitHub Actions sets it
    # as a real process env var before any step runs, it would silently
    # beat scripts/write-e2e-env.sh's .env.test.local every single time —
    # Next's (and Node's) env loading always treats an already-set
    # process.env value as final, never overridden by a `.env*` file.
    # That's exactly what was happening: the E2E browser was POSTing to
    # https://placeholder.supabase.co instead of the local stack, despite
    # .env.test.local having the right value the whole time, because this
    # block used to be workflow-level and pre-empted it in every job.
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      # `LayoutProps`/`PageProps` are ambient types Next.js generates into
      # .next/types — they don't exist until typegen/build has run once, so
      # this must come before `tsc --noEmit` or every route file's props
      # fail to resolve.
      - name: Generate route types
        run: npx next typegen

      - name: Type-check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

  dependency-audit:
    name: Dependency vulnerability audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Informational: surfaces known vulns in dependencies without
      # blocking merges on transitive advisories outside our control.
      - name: npm audit (high/critical)
        run: npm audit --audit-level=high
        continue-on-error: true

  supabase-security-gate:
    name: Supabase security gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Same check as the local pre-push hook (.husky/pre-push), mirrored
      # into CI so it can't be skipped by --no-verify, a GitHub web-UI
      # merge, or a clone that never ran `npm install`. Fails closed if
      # SUPABASE_ACCESS_TOKEN is missing — see scripts/check-supabase-security.sh.
      - name: Run Supabase security advisors
        run: npm run supabase:security-check
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    # Same placeholder rationale as lint-typecheck-build above — some
    # imported modules construct a Supabase client with these values
    # present (even though the actual client calls are mocked in tests),
    # so they need to be *some* well-formed string, not real credentials.
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Run unit tests
        run: npm run test

  test-e2e:
    name: E2E tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # Runs against a real local Supabase stack (Docker, pre-installed on
      # ubuntu-latest runners) rather than a shared remote project — E2E
      # tests exercise real auth/signup/RLS flows, which the placeholder
      # env vars used by the other CI jobs can't support, and a local
      # throwaway stack avoids polluting or racing against production data.
      - name: Start local Supabase
        run: npx supabase start

      # Applies supabase/migrations/ and seeds supabase/seed/prompts.sql —
      # same command a developer runs locally (see README's local-dev docs).
      - name: Reset database (migrations + seed)
        run: npx supabase db reset

      # No separate "write env vars" or "build" step needed — the
      # `test:e2e` script (package.json) runs scripts/write-e2e-env.sh
      # (regenerates .env.test.local from the local stack above) *before*
      # `playwright test` starts, then webServer rebuilds
      # (`npm run build && npm run start`) against those same fresh
      # values, every time — never against a stale/mismatched prior build.
      # Passing env vars through this job's own shell (e.g. via
      # $GITHUB_ENV) turned out to be unreliable in practice;
      # write-e2e-env.sh sidesteps that entirely.
      - name: Run E2E tests
        run: npm run test:e2e

      - name: Stop local Supabase
        if: always()
        run: npx supabase stop

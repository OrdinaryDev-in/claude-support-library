name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Placeholder values only — the build never contacts Supabase (all data-
# fetching routes are dynamic due to cookies()/auth checks and are skipped
# during static generation), so these just need to be present strings.
env:
  NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
  NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key

jobs:
  lint-typecheck-build:
    name: Lint, type-check, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      # `LayoutProps`/`PageProps` are ambient types Next.js generates into
      # .next/types — they don't exist until typegen/build has run once, so
      # this must come before `tsc --noEmit` or every route file's props
      # fail to resolve.
      - name: Generate route types
        run: npx next typegen

      - name: Type-check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Run unit tests
        run: npm run test

  dependency-audit:
    name: Dependency vulnerability audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Informational: surfaces known vulns in dependencies without
      # blocking merges on transitive advisories outside our control.
      - name: npm audit (high/critical)
        run: npm audit --audit-level=high
        continue-on-error: true

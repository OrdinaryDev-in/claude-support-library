name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, so drift/new advisory patterns get caught even without a push.
    - cron: "17 3 * * 1"

jobs:
  analyze:
    name: Analyze (javascript-typescript)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      # codeql-action/analyze fetches the triggering workflow run (for its
      # diff-range/telemetry features) via the REST API — without this it
      # 403s on that call and logs a noisy (but non-fatal) error; the SARIF
      # scan and upload complete fine either way since they only need
      # security-events: write.
      actions: read
    steps:
      - uses: actions/checkout@v5

      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript

      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript-typescript"
